name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare public site artifact
        run: |
          rm -rf _site
          mkdir -p _site
          for page in ./*.html; do cp "$page" _site/; done
          for required_file in CNAME .nojekyll robots.txt sitemap.xml; do
            test -f "$required_file" && cp "$required_file" _site/
          done
          rsync -a assets/ _site/assets/

      - name: Audit public site artifact
        run: python3 scripts/public-site-audit.py --root _site

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
